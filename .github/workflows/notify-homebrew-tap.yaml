name: Notify Homebrew Tap

on:
  workflow_run:
    workflows: ["Build and Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g., v1.2.3)"
        required: true
        type: string

jobs:
  dispatch:
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
    steps:
      - name: Validate tag
        run: |
          if [ -z "$TAG" ]; then
            echo "ERROR: No tag available (both github.event.release.tag_name and github.ref_name are empty)"
            exit 1
          fi
          echo "Using tag: $TAG"

      - name: Collect bottle checksums from the release
        id: bottles
        env:
          GH_TOKEN: ${{ secrets.RONA_PRS_TOKEN }}
        run: |
          VERSION="${TAG#v}"
          gh release download "$TAG" -R rona-rs/rona -p "*.bottle.tar.gz" -D bottles --clobber
          for platform in arm64_sequoia sequoia x86_64_linux; do
            FILE="bottles/rona-${VERSION}.${platform}.bottle.tar.gz"
            if [ ! -f "$FILE" ]; then
              echo "ERROR: missing bottle asset ${FILE} on release ${TAG}"
              exit 1
            fi
            SHA=$(sha256sum "$FILE" | cut -d " " -f 1)
            echo "sha256_${platform}=${SHA}" >> "$GITHUB_OUTPUT"
          done

      - name: Check if PR already exists in tap (guard)
        id: guard
        env:
          TOKEN: ${{ secrets.RONA_PRS_TOKEN }}
        run: |
          OWNER="rona-rs"
          REPO="homebrew-rona"
          BRANCH="bump/rona-${TAG}"
          API_URL="https://api.github.com/repos/${OWNER}/${REPO}/pulls?state=open&head=${OWNER}:${BRANCH}"
          # Query open PRs with the expected head branch (the API head filter needs owner:branch)
          echo "Checking for existing PRs at: ${API_URL}"
          RES=$(curl -s -H "Authorization: token ${TOKEN}" "${API_URL}")

          # Check if response is valid JSON array (not an error object)
          if ! echo "$RES" | jq -e 'type == "array"' > /dev/null 2>&1; then
            echo "ERROR: Invalid API response (possibly auth issue)"
            echo "Response: $RES"
            exit 1
          fi

          COUNT=$(echo "$RES" | jq 'length')
          if [ "$COUNT" -gt 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Found existing PR for ${BRANCH}, skipping dispatch"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No existing PR for ${BRANCH}, will dispatch"
          fi

      - name: Dispatch update to homebrew-rona
        if: steps.guard.outputs.exists == 'false'
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.RONA_PRS_TOKEN }}
          repository: rona-rs/homebrew-rona
          event-type: rona-release
          client-payload: |
            {
              "tag": "${{ env.TAG }}",
              "tarball_url": "https://github.com/rona-rs/rona/archive/refs/tags/${{ env.TAG }}.tar.gz",
              "sha256_arm64_sequoia": "${{ steps.bottles.outputs.sha256_arm64_sequoia }}",
              "sha256_sequoia": "${{ steps.bottles.outputs.sha256_sequoia }}",
              "sha256_x86_64_linux": "${{ steps.bottles.outputs.sha256_x86_64_linux }}"
            }
